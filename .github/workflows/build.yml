
name: Build LAN File Server APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.example \
            --project-name lan_file_server .

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Get dependencies
        run: flutter pub get

      - name: Fix application compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          if p.exists():
              s = p.read_text()
              s = s.replace(
                  "compileSdk = flutter.compileSdkVersion",
                  "compileSdk = 36"
              )
              p.write_text(s)
          else:
              p = Path("android/app/build.gradle")
              s = p.read_text()
              s = s.replace(
                  "compileSdkVersion flutter.compileSdkVersion",
                  "compileSdkVersion 36"
              )
              s = s.replace(
                  "compileSdk flutter.compileSdkVersion",
                  "compileSdk 36"
              )
              p.write_text(s)
          PY

      - name: Fix file_picker compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"

          files = list(root.glob("file_picker-*/android/build.gradle"))
          files += list(root.glob("file_picker-*/android/build.gradle.kts"))

          if not files:
              raise SystemExit("file_picker Gradle file not found")

          for p in files:
              s = p.read_text()

              s = re.sub(
                  r'compileSdkVersion\s+34\b',
                  'compileSdkVersion 36',
                  s
              )

              s = re.sub(
                  r'compileSdk\s*=\s*34\b',
                  'compileSdk = 36',
                  s
              )

              s = re.sub(
                  r'compileSdk\s+34\b',
                  'compileSdk 36',
                  s
              )

              p.write_text(s)
              print("Updated:", p)
          PY

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAN-File-Server-APK
          path: build/app/outputs/flutter-apk/app-release.apk
