
name: Build LAN File Server APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"

          echo "Android SDK: $SDK_ROOT"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Generate Android project
        run: |
          flutter create \
            --platforms=android \
            --org com.example \
            --project-name lan_file_server .

      - name: Set compile SDK 36
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i \
              's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/' \
              android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i \
              's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/' \
              android/app/build.gradle
            sed -i \
              's/compileSdk flutter.compileSdkVersion/compileSdk 36/' \
              android/app/build.gradle
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LAN-File-Server-APK
          path: build/app/outputs/flutter-apk/app-release.apk
